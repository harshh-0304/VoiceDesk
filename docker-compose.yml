services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - VOICEDESK_MODEL=${VOICEDESK_MODEL:-llama-3.3-70b-versatile}
      - VOICEDESK_VOICE=${VOICEDESK_VOICE:-en-US-ChristopherNeural}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/audio
    depends_on:
      - backend
    restart: unless-stopped
